name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Set up native toolchain
      run: |
        python3 terminal-emulator/native/install-zig.py "$RUNNER_TEMP/muxy-zig"
        echo "$RUNNER_TEMP/muxy-zig" >> "$GITHUB_PATH"
        NDK_VERSION="$(awk -F= '$1 == "ndkVersion" {print $2}' gradle.properties)"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
    - name: Execute tests
      run: |
        ./gradlew test
