name: Verify Release APKs

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_SIGNER_SHA256: 756768af514d3fa0d1c214d54dabd7b0cd088a1723a22f520b90e8e8545262ce
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APK verification tools
        run: |
          NDK_VERSION="$(awk -F= '$1 == "ndkVersion" {print $2}' gradle.properties)"
          sdkmanager 'build-tools;36.0.0' "ndk;$NDK_VERSION"

      - name: Download and verify published artifacts
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts --pattern '*.apk' --pattern SHA256SUMS
          python3 scripts/verify-release.py artifacts "${RELEASE_TAG#v}" "$EXPECTED_SIGNER_SHA256"
