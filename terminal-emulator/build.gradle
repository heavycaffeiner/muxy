apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace "com.termux.emulator"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        multipleVariants {
            withSourcesJar()
            withJavadocJar()
            allVariants()
        }
    }
}

def prepareGhostty = tasks.register('prepareGhostty', Exec) {
    workingDir projectDir
    environment 'ANDROID_HOME', android.sdkDirectory.absolutePath
    commandLine 'bash', 'native/build.sh'
}

tasks.configureEach {
    if (name.startsWith('configureNdkBuild') || name.startsWith('buildNdkBuild')) {
        dependsOn prepareGhostty
    }
}

def prepareHostJni = tasks.register('prepareHostJni', Exec) {
    workingDir projectDir
    commandLine 'bash', 'native/build-host-jni.sh', System.getProperty('java.home')
}

tasks.withType(Test).configureEach {
    dependsOn prepareHostJni
    systemProperty 'java.library.path', file('build/native/host/jni').absolutePath
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.0"
    testImplementation "junit:junit:4.13.2"
}

task sourceJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier = "sources"
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.default
                groupId = 'com.termux'
                artifactId = 'terminal-emulator'
                version = '0.119.0'
                artifact(sourceJar)
            }
        }
    }
}
